# Publishes the page on GitHub Pages. In the repository: Settings → Pages → Source: "GitHub Actions".
# data/ (images, videos and manifest.json) is filled on your computer by tools/get_images.py and tools/get_videos.py, then committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (only what the page needs)
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          touch _site/.nojekyll
          test -f _site/data/manifest.json || { echo "data/manifest.json is missing: run tools/get_images.py (and get_videos.py) and commit data/"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
