# Publishes the page on GitHub Pages. In the repository: Settings → Pages → Source: "GitHub Actions".
# The folder listing that the page reads locally doesn't exist on Pages, so the build writes rooms/manifest.json.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage the site (only what the page needs)
        run: |
          mkdir _site
          cp -r index.html css js rooms _site/
          touch _site/.nojekyll
      - name: Write the room manifest
        run: node tools/build-manifest.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
