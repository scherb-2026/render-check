<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Render check — photo vs. 3D render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/room.css">
<link rel="stylesheet" href="css/notices.css">
<link rel="stylesheet" href="css/topbar.css">
</head>
<body>
<div class="wrap">
  <div class="topbars" id="topbars" hidden>
    <div class="row"><span class="rowlbl" id="statDs"><span class="nm">Dataset</span><span class="num"></span></span><nav class="tabrow" id="dsTabs" role="tablist" aria-label="Datasets"></nav></div>
    <div class="row"><span class="rowlbl" id="statColor"><span class="nm">Colour</span><span class="num"></span></span><nav class="tabrow" id="colorTabs" role="tablist" aria-label="Glove colours"></nav></div>
    <div class="row"><span class="rowlbl" id="statTool"><span class="nm">Tool</span><span class="num"></span></span><nav class="tabrow" id="toolTabs" role="tablist" aria-label="Tools"></nav></div>
    <div class="row view"><span class="rowlbl" id="statView"><span class="nm">View</span><span class="num"></span></span>
      <nav class="extras" id="sideTabs" role="tablist" aria-label="Media type">
        <button type="button" role="tab" data-tab="video" aria-selected="false"><span class="lbl">Videos</span><span class="n"></span></button>
        <button type="button" role="tab" data-tab="image" aria-selected="false"><span class="lbl">Images</span><span class="n"></span></button>
      </nav>
      <div class="extras" id="modeTabs" role="group" aria-label="Comparison mode for the whole gallery">
        <button type="button" data-mode="slider" aria-pressed="true">Slider</button>
        <button type="button" data-mode="fade" aria-pressed="false">Fade</button>
        <button type="button" data-mode="diff" aria-pressed="false">Difference</button>
      </div></div>
  </div>

  <main id="rooms" class="rooms"></main>

  <div class="transport" id="transport" role="group" aria-label="Playback of all videos" hidden>
    <button type="button" class="icon play" aria-label="Play">
      <svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button type="button" class="icon back" aria-label="Previous frame" title="Previous frame (,)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6M6 6v12"/></svg>
    </button>
    <button type="button" class="icon fwd" aria-label="Next frame" title="Next frame (.)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6M18 6v12"/></svg>
    </button>
    <input type="range" class="seek" min="0" max="10000" value="0" step="1" aria-label="Seek">
    <span class="time">0:00.00 / 0:00.00</span>
    <select class="speed" aria-label="Playback speed" title="Playback speed">
      <option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <button type="button" class="icon toggle loop" aria-pressed="true" aria-label="Loop" title="Loop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
    </button>
  </div>
</div>

<template id="roomTpl">
  <section class="room">
    <div class="stage mode-slider">
      <div class="blend"></div>
      <span class="cam"></span>
      <div class="tabs" role="tablist" aria-label="Renders" hidden></div>
    </div>
    <div class="warn" hidden></div>
  </section>
</template>

<!-- Classic scripts, in this order: they share one global scope, which keeps the page working when opened straight from disk. -->
<script src="js/core/config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/lib/exr.js"></script>
<script src="js/media/media.js"></script>
<script src="js/room/gallery.js"></script>
<script src="js/room/transport.js"></script>
<script src="js/room/room.js"></script>
<script src="js/app/render-page.js"></script>
<script src="js/app/discovery.js"></script>
<script src="js/app/shortcuts.js"></script>
<script src="js/app/main.js"></script>
</body>
</html>
